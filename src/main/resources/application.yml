server:
  port: 8080
  servlet:
    session:
      cookie:
        name: SESSION
        same-site: lax
        http-only: true

spring:
  application:
    name: Dindin
  datasource:
    url: jdbc:h2:mem:dindin;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jooq:
    sql-dialect: POSTGRES
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true



logging:
  level:
    org.springframework.security: INFO
    org.jooq.Constants: WARN
